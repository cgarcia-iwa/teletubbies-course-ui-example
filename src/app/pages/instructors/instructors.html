<header class="page-header">
  <h1>Instructores</h1>
  <input type="search" placeholder="Buscar por nombre" />
</header>

<table>
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Correo</th>
      <th>Rol</th>
    </tr>
  </thead>
  <tbody>
    @if (instructors$ | async; as instructors) {
      @for (instructor of instructors; track instructor.id) {
        <tr>
          <td>{{ instructor.fullName }}</td>
          <td>{{ instructor.email }}</td>
          <td>{{ instructor.role }}</td>
        </tr>
      } @empty {
        <tr>
          <td colspan="3" class="empty">No hay instructores que mostrar.</td>
        </tr>
      }
    } @else {
      <tr>
        <td colspan="3" class="empty">Cargando instructores…</td>
      </tr>
    }
  </tbody>
</table>
