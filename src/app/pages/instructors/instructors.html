<header class="page-header">
  <h1>Instructores</h1>
  <input type="search" placeholder="Buscar por nombre" [value]="nameFilter()" (input)="onFilterInput($event)" />
</header>

<table>
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Correo</th>
      <th>Rol</th>
    </tr>
  </thead>
  <tbody>
    @for (instructor of filteredInstructors(); track instructor.id) {
      <tr>
        <td>{{ instructor.fullName }}</td>
        <td>{{ instructor.email }}</td>
        <td>{{ instructor.role }}</td>
      </tr>
    } @empty {
      <tr>
        <td colspan="3" class="empty">No hay instructores que mostrar.</td>
      </tr>
    }
  </tbody>
</table>
