<div class="d-flex justify-content-between align-items-center mt-3">
  <strong>Total: {{ totalElements() }}</strong>

  <nav aria-label="Paginación">
    <ul class="pagination mb-0">
      <li class="page-item" [class.disabled]="page() === 0">
        <button type="button" class="page-link" (click)="goTo(page() - 1)">Anterior</button>
      </li>
      @for (p of pages(); track p) {
        <li class="page-item" [class.active]="p === page()">
          <button type="button" class="page-link" (click)="goTo(p)">{{ p + 1 }}</button>
        </li>
      }
      <li class="page-item" [class.disabled]="page() >= totalPages() - 1">
        <button type="button" class="page-link" (click)="goTo(page() + 1)">Siguiente</button>
      </li>
    </ul>
  </nav>
</div>
