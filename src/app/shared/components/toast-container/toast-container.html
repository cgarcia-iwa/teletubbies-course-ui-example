<div class="toast-container position-fixed top-0 end-0 p-3" aria-live="polite" aria-atomic="true">
  @for (toast of notify.toasts(); track toast.id) {
    <div class="toast show border-0" [class]="'text-bg-' + toast.type" role="alert">
      <div class="d-flex">
        <div class="toast-body">
          <strong class="d-block">{{ toast.title }}</strong>
          @if (toast.message) {
            <span>{{ toast.message }}</span>
          }
        </div>
        <button
          type="button"
          class="btn-close btn-close-white me-2 m-auto"
          aria-label="Close"
          (click)="notify.dismiss(toast.id)"></button>
      </div>
    </div>
  }
</div>
