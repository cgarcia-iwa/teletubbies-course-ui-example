server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 256;

    # Nunca cachear el index.html (referencia los assets con hash)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Solo los assets con hash en el nombre (p. ej. main-7BS5TNZP.js) son inmutables.
    # El build de development genera main.js, styles.css, etc. sin hash: esos caen
    # en "location /" y se revalidan en cada carga.
    location ~* "-[A-Za-z0-9_-]{8}\.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Fallback SPA: cualquier ruta (p. ej. /courses) sirve index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
